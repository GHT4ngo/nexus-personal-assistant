name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run evaluate:report
      - run: npm run evaluate:dates
      - run: npm run evaluate:core
      - run: npm run evaluate:core:v2
      - run: git diff --exit-code evaluation/reports/weak-baseline-v1.json
      - run: git diff --exit-code evaluation/reports/deterministic-dates-v1.json
      - run: git diff --exit-code evaluation/reports/deterministic-core-v1.json
      - run: git diff --exit-code evaluation/reports/deterministic-core-v2.json
      - run: npm run mobile:prepare

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run mobile:prepare
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
